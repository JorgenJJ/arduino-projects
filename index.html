<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arduino projects</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/themes/vue.css">
  <style>.wokwi { overflow-x: auto; margin: 1em 0; }</style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'Arduino projects',
      repo: 'JorgenJJ/arduino-projects',
      loadSidebar: true,
      alias: { '/.*/_sidebar.md': '/_sidebar.md' },
      subMaxLevel: 2,
      relativePath: true,
      search: { depth: 3 },
      markdown: { renderer: { code(code, lang) {
        return lang === 'mermaid' ? `<pre class="mermaid">${code}</pre>` : this.origin.code.apply(this, arguments);
      } } },
      plugins: [hook => hook.doneEach(() => mermaid.run())]
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
  <script>mermaid.initialize({ startOnLoad: false });</script>
  <script src="wokwi.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-c.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-cpp.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-arduino.min.js"></script>
</body>
</html>
